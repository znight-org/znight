<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 490" width="688" height="490" role="img" aria-labelledby="title desc">
<title id="title">How a dependency is bound</title>
<desc id="desc">For an injection point of type T with an optional qualifier, the compiler collects the candidates: providers of T and of its subtypes, only those named q with a qualifier. A T[] injection receives all of them, ordered by token. With no candidate: a runtime-provided type of a package binds to the external, an optional dependency to undefined, otherwise ZNIGHT001. With one or more: the unique exact candidate, else the unique @Primary(), else the single candidate is bound; otherwise ZNIGHT004 when they all provide the same type, ZNIGHT008 when ambiguous. Primitives need a qualifier (ZNIGHT010) and Lazy&lt;T&gt; binds T with the same rules.</desc>
<defs>
<linearGradient id="zn-card" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1A2350"/>
<stop offset="1" stop-color="#0B1020"/>
</linearGradient>
<linearGradient id="zn-accent" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#2F6AE8"/>
<stop offset="1" stop-color="#7C4DEF"/>
</linearGradient>
<linearGradient id="zn-accent-line" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#3E7BFA"/>
<stop offset="1" stop-color="#8B5CF6"/>
</linearGradient>
<style>.s{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}</style>
</defs>
