<text x="648" y="66" text-anchor="end" class="s" font-size="13" font-weight="600" fill="#F4F6FC">request scope</text>
<text x="648" y="84" text-anchor="end" class="s" font-size="12" fill="#A9B4D6"><tspan class="m">container.runInScope()</tspan> with <tspan class="m">HttpContext</tspan>, <tspan class="m">RequestId</tspan></text>
<rect x="40" y="98" width="608" height="404" rx="12" fill="#F4F6FC" fill-opacity="0.03" stroke="url(#zn-accent-line)" stroke-width="1.25"/>
<text x="632" y="120" text-anchor="end" class="s" font-size="13" font-weight="600" fill="#F4F6FC"><tspan class="m">http:request</tspan> hook</text>
<text x="632" y="138" text-anchor="end" class="s" font-size="12" fill="#A9B4D6">wrappers log, measure and trace</text>
