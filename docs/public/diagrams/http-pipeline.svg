<text x="225" y="459.2" text-anchor="middle" class="s" font-size="13.5" font-weight="600" fill="#F4F6FC">serialise the result</text>
<text x="225" y="476.5" text-anchor="middle" class="s" font-size="12" fill="#A9B4D6">files: preconditions, ranges · event streams</text>
