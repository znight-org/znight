<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 660" width="688" height="660" role="img" aria-labelledby="title desc">
<title id="title">HTTP request pipeline</title>
<desc id="desc">Each request routed by the adapter runs in a request scope (container.runInScope with HttpContext and RequestId), inside the http:request hook whose wrappers log, measure and trace. A CORS preflight is answered there (204, 403 or 404) without guards. Otherwise: guards (global, controller, route), body parsing for routes with @Body or uploads, interceptors (global, controller, route) around the invocation (extract, coerce, validate, handler), then serialisation of the result. Anything thrown becomes an error response (403 for a guard, 400 for invalid input, exception mappers) and sets event.status and event.error. Then the cookies are appended to set-cookie (one line each) and the request id, CORS and security headers are added when not already set (raw @Res() replies get none), and the scope closes once the body has been sent (for an event stream, once it ends), disposing request-scoped instances.</desc>
<defs>
<linearGradient id="zn-card" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1A2350"/>
<stop offset="1" stop-color="#0B1020"/>
</linearGradient>
<linearGradient id="zn-accent" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#2F6AE8"/>
<stop offset="1" stop-color="#7C4DEF"/>
</linearGradient>
<linearGradient id="zn-accent-line" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#3E7BFA"/>
<stop offset="1" stop-color="#8B5CF6"/>
</linearGradient>
<style>.s{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}</style>
</defs>
<rect x="0.5" y="0.5" width="687" height="659" rx="16" fill="url(#zn-card)" stroke="#2C3660"/>
<text x="235" y="30" class="s" font-size="12.5" fill="#A9B4D6">request, routed by the adapter</text>
