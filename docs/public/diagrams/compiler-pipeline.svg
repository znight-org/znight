<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 340" width="688" height="340" role="img" aria-labelledby="title desc">
<title id="title">Compiler pipeline</title>
<desc id="desc">The seven steps of the Znight compiler. 1 scan the files matched by include and exclude, plus provider libraries. 2 parse them with oxc and extract per-file facts, both cached per file by content hash. 3 resolve canonical identities. 4 analyse classes with the core and the compiler extensions. 5 bind every injection point. 6 validate the whole graph, reporting ZNIGHT diagnostics with code frames. 7 emit the module, re-parse it as a check, and write container.generated.ts only if its content changed.</desc>
<defs>
<linearGradient id="zn-card" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1A2350"/>
<stop offset="1" stop-color="#0B1020"/>
</linearGradient>
<linearGradient id="zn-accent" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#2F6AE8"/>
<stop offset="1" stop-color="#7C4DEF"/>
</linearGradient>
<linearGradient id="zn-accent-line" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#3E7BFA"/>
<stop offset="1" stop-color="#8B5CF6"/>
</linearGradient>
<style>.s{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}</style>
</defs>
