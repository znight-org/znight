<line x1="262" y1="41" x2="262" y2="51" stroke="#A9B4D6" stroke-width="1.5"/>
<text x="262" y="34" text-anchor="middle" class="m" font-size="12.5" fill="#D6DCEE">start()</text>
<line x1="628" y1="41" x2="628" y2="51" stroke="#A9B4D6" stroke-width="1.5"/>
<text x="628" y="34" text-anchor="middle" class="m" font-size="12.5" fill="#D6DCEE">stop()</text>
<text x="445" y="34" text-anchor="middle" class="s" font-size="12.5" fill="#A9B4D6">requests and messages</text>
<rect x="24" y="62" width="640" height="52" rx="10" fill="#F4F6FC" fill-opacity="0.03"/>
<text x="38" y="76" class="m" font-size="13.5" font-weight="600" fill="#F4F6FC">singleton</text>
<text x="38" y="93" class="s" font-size="12" fill="#A9B4D6">one instance for</text>
<text x="38" y="108" class="s" font-size="12" fill="#A9B4D6">the application</text>
<line x1="160" y1="72" x2="160" y2="104" stroke="#34407A" stroke-width="1"/>
<rect x="24" y="124" width="640" height="82" rx="10" fill="#F4F6FC" fill-opacity="0.03"/>
<text x="38" y="153" class="m" font-size="13.5" font-weight="600" fill="#F4F6FC">request</text>
<text x="38" y="170" class="s" font-size="12" fill="#A9B4D6">one per request</text>
<text x="38" y="185" class="s" font-size="12" fill="#A9B4D6">scope, isolated</text>
