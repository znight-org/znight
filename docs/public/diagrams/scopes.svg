<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 292" width="688" height="292" role="img" aria-labelledby="title desc">
<title id="title">Provider scopes</title>
<desc id="desc">Lifetimes along the life of the application. A singleton is created at startup by Application.create(), shared by everyone and disposed on stop(). A request-scoped provider has one instance per request scope (an HTTP request or a message delivery); concurrent scopes are isolated. A transient provider gets a new instance for every injection, owned by the singleton or request-scoped instance it is injected into.</desc>
<defs>
<linearGradient id="zn-card" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1A2350"/>
<stop offset="1" stop-color="#0B1020"/>
</linearGradient>
<linearGradient id="zn-accent" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#2F6AE8"/>
<stop offset="1" stop-color="#7C4DEF"/>
</linearGradient>
<linearGradient id="zn-accent-line" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#3E7BFA"/>
<stop offset="1" stop-color="#8B5CF6"/>
</linearGradient>
<style>.s{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}</style>
</defs>
