<path d="M168,46 L654.5,46" fill="none" stroke="#7381B3" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M662,46 L653.5,50.6 L653.5,41.4 Z" fill="#7381B3"/>
