# Slow suites: end-to-end tests, Docker integration tests and the packed-tarball smoke test.
#
# Every pull request, every push to main, before every release (the release workflow calls it on
# the commit it publishes) and once a week, to catch what changes without a commit (base images,
# brokers, the npm registry). See RELEASING.md.
name: CI (full)

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 4 * * 1" # Mondays, 04:00 UTC
  # manual runs, and the release workflow running it on the version pull request (see release.yml)
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # a new push to a pull request cancels its previous run; every other run has a group of its own
  group: ci-full-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    # every e2e suite starts the production builds on Node.js 24 AND on Bun: one job covers both
    name: E2E (Node 24 + Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          build: "true"
      - name: Examples, golden and CLI e2e
        run: bun run test:e2e

  integration:
    name: Integration (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      # the worker example's e2e publishes jobs to a real broker (ZNIGHT_E2E_RABBITMQ_URL)
      rabbitmq:
        image: rabbitmq:4.1-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          build: "true"
      - name: Messaging drivers (RabbitMQ, LocalStack SQS, Kafka via testcontainers)
        run: bun run test:integration
      # only the RabbitMQ scenarios (the in-memory ones run in the e2e job), one example at a time
      - name: Worker example e2e against RabbitMQ
        working-directory: examples/worker
        env:
          ZNIGHT_E2E: "1"
          ZNIGHT_E2E_RABBITMQ_URL: amqp://guest:guest@localhost:5672
        run: bun run test -t RabbitMQ
      - name: Microservice example e2e against RabbitMQ
        working-directory: examples/microservice
        env:
          ZNIGHT_E2E: "1"
          ZNIGHT_INTEGRATION: "1"
        run: bun run test -t RabbitMQ

  smoke:
    name: Packed tarballs (${{ matrix.pm }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pm: [ npm, bun ]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          build: "true"
      - name: Install the tarballs in a clean app, build it, run it on Node.js 24 and Bun
        run: bun run release:smoke --pm ${{ matrix.pm }}
