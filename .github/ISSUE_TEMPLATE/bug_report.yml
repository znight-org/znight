name: Bug report
description: Something does not work as documented
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Security issues must **not** be reported here:
        see [SECURITY.md](https://github.com/znight-org/znight/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead. Include the full error (ZNIGHT0xx code, stack trace).
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A repository or the smallest code that shows the problem (providers, controllers, znight.config.ts).
      render: ts
    validations:
      required: true
  - type: input
    id: packages
    attributes:
      label: Znight version
      description: Output of `npm ls @znight/core` (all `@znight/*` packages share one version).
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      multiple: true
      options:
        - Node.js
        - Bun
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Runtime, package manager and OS versions
      placeholder: Node.js 24.x / Bun 1.3.x, npm 11 / bun / pnpm, macOS 15
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - compiler (build-time analysis, errors, Vite plugin)
        - core (container, lifecycle, plugins)
        - http
        - messaging
        - config
        - observability
        - openapi
        - schedule
        - testing
        - cli
        - docs
