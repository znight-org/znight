version: 2

updates:
  # bun workspaces (bun.lock): packages/*, examples/*, docs
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      dependencies:
        update-types: [ minor, patch ]
        patterns: [ "*" ]

  - package-ecosystem: github-actions
    directories: [ /, /.github/actions/* ]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: [ "*" ]
