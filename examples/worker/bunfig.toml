# Bun loads .env files into process.env by itself (`.env.development` when NODE_ENV is unset), with
# its own precedence and `$VAR` expansion. Leave them to ConfigPlugin (dotenv()), so that Node.js and
# Bun read exactly the same values.
env = false

[test]
# Regenerates the DI container (src/.znight/container.generated.ts) before the tests run, with the
# options of znight.config.ts. (Bun has no bunfig setting for export conditions: the in-repo
# `test` script passes --conditions=@znight/source on the command line instead.)
preload = ["@znight/compiler/bun"]
